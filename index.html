<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIDE Never Die - Online Patcher</title>
    
    <!-- Required RomPatcher.js Core Web Component Engines -->
    <link type="text/css" rel="stylesheet" href="./rom-patcher-js/style.css" media="all" />
    <script type="text/javascript" src="./rom-patcher-js/RomPatcher.webapp.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .patcher-container {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            text-align: center;
            max-width: 480px;
            width: 100%;
            border: 1px solid #333;
        }
        h2 {
            color: #fff;
            margin-top: 0;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }
        .instructions {
            color: #aaaaaa;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .rom-requirements {
            background-color: #262626;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            text-align: left;
            margin-bottom: 25px;
            border-left: 4px solid #ff3b30;
        }
        .rom-requirements ul {
            margin: 5px 0 0 0;
            padding-left: 20px;
        }
    </style>
</head>
<body>

<div class="patcher-container">
    <h2>PRIDE Never Die Patcher</h2>
    <p class="instructions">Load your clean N64 base ROM below to automatically apply the <strong>PRIDE Never Die</strong> modification.</p>

    <div class="rom-requirements">
        <strong>Required Base ROM Profile:</strong>
        <ul>
            <li>File: <code>Virtual Pro Wrestling 2 - Oudou Keishou (Japan)</code></li>
            <li>Extension: <code>.z64</code> (or a <code>.zip</code> containing it)</li>
            <li>Expected CRC32: <code>F620835D</code></li>
        </ul>
    </div>

    <!-- NATIVE CHOSEN INJECTION LOCATION REQUIRED BY LIBRARY CONSTRUCTORS -->
    <div id="rom-patcher-container"></div>
</div>

<script type="text/javascript">
    window.addEventListener('load', function() {
        const myPatcherSettings = {
            language: 'en',
            requireValidation: true,
            allowDropFiles: true
        };

        // Construct the URL step by step cleanly to bypass character truncation bugs
        const proxyPrefix = "https://corsproxy.io";
        const rawServer = "https://raw.githubusercontent.com/";
        const targetRepo = "mostdaysarebaddays/PRIDE-Never-Die/";
        const targetAsset = "main/pride.xdelta";
        
        const absolutePatchUrl = proxyPrefix + encodeURIComponent(rawServer + targetRepo + targetAsset);

        const patchDetails = {
            file: absolutePatchUrl,
            name: "PRIDE Never Die",
            inputCrc32: "F620835D", // Verifies target Virtual Pro Wrestling 2 ROM
            outputName: "PRIDE Never Die.z64" // Auto-formats the file name upon download
        };

        // Trigger native application initialization into the UI container wrapper
        if (typeof RomPatcherWeb !== 'undefined') {
            RomPatcherWeb.initialize(myPatcherSettings, patchDetails);
        }
    });
</script>

</body>
</html>
